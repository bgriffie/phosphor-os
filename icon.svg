<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="4" height="1" fill="#000" fill-opacity=".35"/>
    </pattern>
    <filter id="nz">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .25 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#D9CDB4"/>
  <rect width="512" height="512" filter="url(#nz)"/>
  <rect width="512" height="10" fill="#E8DFCB"/>
  <rect x="56" y="56" width="400" height="330" rx="34" fill="#BFB193"/>
  <rect x="72" y="70" width="368" height="302" rx="26" fill="#030703"/>
  <!-- GLYPH: 3x3 app grid, centre tile amber -->
  <g filter="url(#g)">
    <g fill="#39FF6A">
      <rect x="160" y="125" width="52" height="52"/><rect x="230" y="125" width="52" height="52"/><rect x="300" y="125" width="52" height="52"/>
      <rect x="160" y="195" width="52" height="52"/><rect x="300" y="195" width="52" height="52"/>
      <rect x="160" y="265" width="52" height="52"/><rect x="230" y="265" width="52" height="52"/><rect x="300" y="265" width="52" height="52"/>
    </g>
    <rect x="230" y="195" width="52" height="52" fill="#FFB13B"/>
  </g>
  <rect x="72" y="70" width="368" height="302" rx="26" fill="url(#s)"/>
  <rect x="96" y="420" width="120" height="10" rx="3" fill="#9C8E70"/>
  <circle cx="400" cy="425" r="9" fill="#39FF6A"/>
</svg>
