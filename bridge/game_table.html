<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTG Table</title>
<style>
/* ---------- control ---------- */
body.control{background:#14161a;color:#e8e8e8;font:14px system-ui,sans-serif;margin:0}
.wrap{display:flex;align-items:flex-start}
#pv{position:sticky;top:0;flex:0 0 auto;width:min(42vw,calc((100vh - 40px)*60/72));padding:8px;box-sizing:border-box}
#pv iframe{width:100%;border:1px solid #333;border-radius:8px;background:#000;display:block}
#pv .cap{color:#888;font-size:12px;text-align:center;margin-top:4px}
#app{flex:1;min-width:0}
header{position:sticky;top:0;background:#1d2026;padding:8px 12px;border-bottom:1px solid #333;z-index:5}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
button{background:#2a2e36;color:#eee;border:1px solid #3a3f49;border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
button:hover{background:#353a44}
button.on{background:#3d6fd8;border-color:#5b8cff}
button.primary{background:#2f7d4f;border-color:#3f9d64}
button.minus{color:#ff8a80}
button.plus{color:#9be7a0}
button .ic{width:16px;height:16px;vertical-align:-3px}
button.mb{padding:3px;width:32px;height:32px;opacity:.35;background:#0f1114}
button.mb.on{opacity:1;background:#262a32;border-color:var(--m);box-shadow:0 0 8px var(--m)}
button.mb .gl{width:22px;height:22px;display:block;margin:auto}
input,select{background:#0f1114;color:#eee;border:1px solid #3a3f49;border-radius:5px;padding:3px 5px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;padding:10px}
.card{background:#1d2026;border:2px solid #2a2e36;border-left:6px solid var(--c);border-radius:10px;padding:8px 10px}
.card.sel{border-color:#9aa;border-left-color:var(--c)}
.card.active{box-shadow:0 0 0 2px var(--c)}
.card.dead{opacity:.45}
.card .name{flex:1;font-weight:600;min-width:6em}
.num{background:#333;border-radius:4px;padding:0 6px;font-weight:700}
.seatname{color:#999;font-size:12px}
.cmdrin{flex:1;min-width:10em}
.big{font-size:44px;font-weight:800;min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums}
.lethal{color:#ff5252}
.steps{display:grid;grid-template-columns:repeat(3,auto);gap:4px}
.steps button{min-width:3.2em;padding:6px}
.cmd{font-size:12px;color:#aaa;margin-top:4px}
.cd{display:inline-flex;align-items:center;gap:3px;margin:2px 10px 2px 0;color:#ddd}
.cd i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.cd button{padding:0 6px}
.settings{margin:0 10px 20px;padding:10px;background:#1d2026;border-radius:10px}
.settings input[type=number]{width:4em}
.hint{color:#999;font-size:12px}
.sep{width:1px;height:20px;background:#3a3f49;margin:0 4px}
.conn{color:#c33}
.conn.ok{color:#3c3}

/* ---------- display / preview ---------- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
body.display{margin:0;background:#000;overflow:hidden;cursor:none;color:#fff;font-family:system-ui,sans-serif}
body.display.cal,body.preview{cursor:default}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000}
#stage>*{position:absolute}
#stage.idle>*:not(#grid):not(#edit):not(#qrs){visibility:hidden}
.qr{position:absolute;left:0;top:0;background:#fff;border-radius:14px;padding:10px 10px 4px;box-sizing:border-box;text-align:center;color:#000;font:800 15px system-ui}
.qr svg{display:block;width:100%}
body.phone{margin:0;background:#101216;color:#eee;font:16px system-ui,sans-serif}
#ph{padding:0 14px 30px;max-width:520px;margin:auto}
#ph .bar{height:8px;margin:0 -14px 10px}
#ph .msg{margin-top:40vh;transform:translateY(-50%);text-align:center;color:#aaa;font-size:18px}
#ph .turn{text-align:center;color:#999;font-weight:700;letter-spacing:.05em}
#ph .turn.on{color:#ffd34a;font-size:20px}
#ph .life{text-align:center;font-size:min(30vw,130px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
#ph .lifebox{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:8px 0}
#ph .arr{height:min(18vh,120px);border-radius:18px;display:flex;align-items:center;justify-content:center}
#ph .arr svg{width:64px;height:64px}
#ph .run{text-align:center;font-size:28px;font-weight:900;min-height:34px;color:#888;font-variant-numeric:tabular-nums}
#ph .run.loss{color:#ff8a80}#ph .run.gain{color:#9be7a0}
#ph button.hit{filter:brightness(1.6);transform:scale(.97)}
#ph .cmdd{margin:14px 0 0;color:#999;font-size:14px}
#ph .cmdd summary{cursor:pointer;text-transform:uppercase;letter-spacing:.08em;padding:8px 0}
#ph .cmdd .prow.small button{width:40px;font-size:18px;padding:4px 0}
#ph .cmdd .prow b{font-size:18px}
#ph .set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
#ph .set span{color:#bbb}
#ph .set select{min-width:9em}
#ph .set input[type=range]{width:55%;padding:0}
#ph .mrow{flex-wrap:wrap}
body.phone,#ph button,#ph select,#ph input{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#ph input#nm{-webkit-user-select:text;user-select:text}
#ph .life.lethal{color:#ff5252}
#ph .prow{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0}
#ph .prow button{flex:1;font-size:26px;padding:14px 0;border-radius:12px}
#ph .prow.small button{flex:none;width:52px;font-size:22px;padding:8px 0}
#ph .prow b{min-width:2.4ch;text-align:center;font-size:24px}
#ph .who{flex:1;font-weight:700}
#ph button{background:#262a32;color:#eee;border:1px solid #3a3f49;font:inherit;font-weight:800}
#ph button.minus{color:#ff8a80}
#ph button.plus{color:#9be7a0}
#ph button.pass{display:block;width:100%;margin:12px 0;padding:16px;font-size:22px;border-radius:14px;background:#2f7d4f;border-color:#3f9d64}
#ph button.pass.off{opacity:.3}
#ph h3{margin:22px 0 4px;font-size:14px;color:#999;text-transform:uppercase;letter-spacing:.08em}
#ph input,#ph select{background:#0f1114;color:#eee;border:1px solid #3a3f49;border-radius:8px;padding:10px;font:inherit;width:100%;box-sizing:border-box}
#ph select{width:auto}
#ph button.mana{opacity:.3;padding:6px!important}
#ph button.mana.on{opacity:1;border-color:var(--m);box-shadow:0 0 8px var(--m)}
#ph .gl{width:30px;height:30px;display:block;margin:auto}
#board{position:absolute;overflow:visible;transition:filter .3s}
#stage.boardmode>#mats,#stage.boardmode>#badges,#stage.boardmode>#ci,#stage.boardmode>#fxc,#stage.boardmode>#introC,#stage.boardmode>#vic,#stage.boardmode>#tfx,#stage.boardmode>#fly{display:none}
.preview #stage.idle>*:not(#grid):not(#edit){visibility:visible;opacity:.35}
.mtop{position:absolute;pointer-events:none;transition:opacity .9s,filter .9s}
.mtop.dead{filter:grayscale(1);opacity:.3}
.bw{transition:opacity .9s,filter .9s}
#ci{transition:transform .8s,opacity .9s,filter .9s}
#stage.intro .mat:not(.in),#stage.intro .mtop:not(.in),#stage.intro .bw:not(.in),#stage.intro #ci:not(.in){opacity:0;filter:blur(12px) brightness(3)}
#stage.victory .mat:not(.win),#stage.victory .mtop:not(.win),#stage.victory .bw,#stage.victory #ci{opacity:.12}
.mat.win{animation:rot 3s linear infinite}
.mat.win .mact{animation:apulse .8s ease-in-out infinite}
#introC,#vic{width:0;height:0;pointer-events:none}
.ispin{position:absolute;left:0;top:0;animation:spin 6s linear infinite}
.ig{position:absolute;left:0;top:0;width:64px;height:64px;transform:translate(-50%,-50%) rotate(var(--r)) translateY(-130px) rotate(calc(-1*var(--r)));opacity:0;animation:igIn .6s ease-out forwards;animation-delay:var(--d);transition:transform .7s ease-in,opacity .4s .5s}
.ig .gl{width:100%;height:100%;filter:drop-shadow(0 0 10px currentColor)}
@keyframes igIn{from{opacity:0;filter:blur(10px)}to{opacity:1}}
#introC.conv .ig{transform:translate(-50%,-50%);opacity:0}
.itxt{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-weight:900;letter-spacing:.12em;color:#fff;opacity:0}
#introC.txt .itxt{animation:itxt 3s ease-out forwards}
.itxt .a{font-size:52px;color:#ffd34a}
.itxt .b{font-size:22px;opacity:.8;letter-spacing:.4em}
@keyframes itxt{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-180deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4) rotate(0)}}
.vrays{position:absolute;left:0;top:0;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(var(--c) 0 4deg,transparent 4deg 16deg);
  -webkit-mask:radial-gradient(closest-side,#000 15%,transparent 100%);mask:radial-gradient(closest-side,#000 15%,transparent 100%);opacity:.45;animation:spin 24s linear infinite}
.vbox{position:absolute;left:0;top:0;text-align:center;white-space:nowrap}
.vin{animation:vin 1.2s cubic-bezier(.2,1.6,.4,1) both}
@keyframes vin{from{transform:scale(0) rotate(-90deg);opacity:0}}
.vpor{width:170px;height:170px;margin:0 auto 10px;border-radius:50%;padding:7px;background:conic-gradient(from var(--a),var(--grad));animation:rot 3s linear infinite;box-sizing:border-box}
.vpor svg{width:100%;height:100%;color:#ffd34a;background:#000;border-radius:50%;padding:22px;box-sizing:border-box}
.vt{font-size:64px;font-weight:900;letter-spacing:.14em;color:#ffd34a;text-shadow:0 0 18px #ff9d00}
.vn{font-size:26px;font-weight:800;color:var(--c)}
#fxc{left:0;top:0;pointer-events:none}
#mats,#badges,#fly,#edit,#grid,#falloff,#flash{inset:0}
#fly,#falloff,#flash{pointer-events:none}
.mat{position:absolute;box-sizing:border-box;border:4px solid transparent;border-radius:16px;
  background:linear-gradient(var(--fill,#000),var(--fill,#000)) padding-box,conic-gradient(from var(--a),var(--grad)) border-box;animation:rot 14s linear infinite;transition:opacity .6s,filter .6s}
@keyframes rot{to{--a:360deg}}
.mat.dead{filter:grayscale(1);opacity:.25;animation:none}
.mat.b-still{animation:none}
.mat.b-off{background:linear-gradient(var(--fill,#000),var(--fill,#000)) padding-box,linear-gradient(#000,#000) border-box;animation:none}
.mat.e-open,.mat.e-open .mact,.mat.e-open .mfl{border-bottom-width:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.mat.e-fade{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 45%);mask-image:linear-gradient(to top,transparent 0,#000 45%)}
.mact,.mfl{position:absolute;inset:-4px;border:4px solid var(--c);border-radius:16px;opacity:0;pointer-events:none}
.mat.active .mact{animation:apulse 2s ease-in-out infinite}
@keyframes apulse{50%{opacity:.95}}
.mfl{border-width:7px;inset:-7px;border-color:var(--fc)}
.mfl.go{animation:mfl .9s ease-out}
@keyframes mfl{0%{opacity:1}100%{opacity:0}}
.crest{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);display:flex;gap:6px;background:#000;padding:3px 10px;border-radius:24px}
.crest .gl{width:30px;height:30px}
.cz{position:absolute;width:73px;height:101px;box-sizing:border-box;border:2px dashed color-mix(in srgb,var(--c) 40%,#000);border-radius:5px;
  font-size:15px;letter-spacing:.1em;color:color-mix(in srgb,var(--c) 55%,#000);display:flex;align-items:center;justify-content:center}
.cz.cmd{left:12px;top:14px}
.cz.gy{right:12px;top:14px}
.cz.lib{right:12px;top:127px}
.cz.ex{right:97px;top:14px}
.czr{position:absolute;left:97px;right:97px;top:50%;border-top:2px dashed color-mix(in srgb,var(--c) 22%,#000);pointer-events:none}
.czr b{position:absolute;left:0;font-size:13px;letter-spacing:.2em;font-weight:400;color:color-mix(in srgb,var(--c) 35%,#000)}
.czr b:first-child{bottom:6px}.czr b:last-child{top:6px}
.tf{position:absolute;width:0;height:0;pointer-events:none}
.slash{position:absolute;inset:-25%;pointer-events:none}
.slash i{position:absolute;left:5%;width:90%;height:calc(var(--s)*6px);border-radius:4px;background:linear-gradient(90deg,transparent,#fff 30%,var(--sc) 70%,transparent);transform:rotate(-28deg) scaleX(0);animation:slash .6s ease-out forwards;filter:drop-shadow(0 0 6px var(--sc))}
@keyframes slash{0%{transform:rotate(-28deg) scaleX(0);opacity:1}35%{transform:rotate(-28deg) scaleX(1);opacity:1}100%{transform:rotate(-28deg) scaleX(1);opacity:0}}
.die{position:absolute;left:0;top:0;width:230px;height:230px;margin:-115px;animation:dspin 1.6s cubic-bezier(.2,.7,.3,1)}
.die svg{width:100%;height:100%;overflow:visible}
@keyframes dspin{from{transform:rotate(-900deg) scale(.3)}70%{transform:rotate(15deg) scale(1.15)}to{transform:rotate(0) scale(1)}}
.dn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 66px system-ui;color:#fff;padding-top:16px}
.die.land svg{filter:drop-shadow(0 0 16px #9cc0ff)}
.die.nat20 .dn{color:#ffd34a;text-shadow:0 0 18px #ff9d00}
.die.nat1 .dn{color:#ff4040;text-shadow:0 0 18px #ff0000}
.tf.out{transition:opacity .8s;opacity:0}
.coin{position:absolute;left:0;top:0;width:170px;height:170px;margin:-85px;border-radius:50%;box-sizing:border-box;border:7px solid #8a6410;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd34a 40%,#b8860b 78%);display:flex;align-items:center;justify-content:center;font:900 30px system-ui;color:#5a3d00;animation:cflip 1.6s ease-out}
@keyframes cflip{0%{transform:translateY(0) scale(.5,.5)}10%{transform:translateY(-60px) scale(.8,-.8)}20%{transform:translateY(-110px) scale(1,1)}30%{transform:translateY(-140px) scale(1,-1)}40%{transform:translateY(-150px) scale(1,1)}50%{transform:translateY(-140px) scale(1,-1)}60%{transform:translateY(-110px) scale(1,1)}70%{transform:translateY(-60px) scale(1,-1)}80%{transform:translateY(0) scale(1.12,1.12)}90%{transform:scale(1,.92)}100%{transform:scale(1,1)}}
.ftxt{position:absolute;left:0;top:0;font:900 46px system-ui;letter-spacing:.12em;color:#fff;text-shadow:0 0 16px var(--tc),0 0 34px var(--tc);white-space:nowrap;animation:ftxt 2.6s ease-out forwards}
@keyframes ftxt{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.clock{position:absolute;left:0;top:0;transform:translate(-50%,-50%);animation:fin 2.6s ease-out forwards}
.clock svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px #9cc0ff)}
.clock .hand{transform-origin:0 0;animation:rewind 2.2s cubic-bezier(.3,0,.2,1) forwards}
.clock .hand2{transform-origin:0 0;animation:rewind 2.2s linear forwards;animation-duration:.9s;animation-iteration-count:3}
@keyframes rewind{to{transform:rotate(-1080deg)}}
@keyframes fin{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(90deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
.shield{position:absolute;left:0;top:0;transform:translate(-50%,-50%);animation:sh 2.4s ease-out forwards}
.shield svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px #5ab0ff)}
@keyframes sh{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%,30%{opacity:.5;transform:translate(-50%,-50%) scale(1)}25%,35%,60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
.portal{position:absolute;left:0;top:0;transform:translate(-50%,-50%);animation:fin 3s ease-out forwards}
.portal svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px var(--tc))}
.portal .r1{transform-origin:0 0;animation:spin 6s linear infinite}
.portal .r2{transform-origin:0 0;animation:spin 4s linear infinite reverse}
.portal .core{animation:corep 1s ease-in-out infinite alternate}
@keyframes corep{from{opacity:.5}to{opacity:1}}
.bw{position:absolute}
.badge{position:absolute;inset:0;box-sizing:border-box;border:calc(var(--s)*3px) solid transparent;border-radius:calc(var(--s)*12px);
  background:linear-gradient(#000,#000) padding-box,linear-gradient(90deg,var(--grad2)) border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,filter .6s}
.bw.dead .badge{filter:grayscale(1);opacity:.35}
.bw.nob .badge{background:#000}
.bw.non .nmt{display:none}
.bw.lethal .badge{background:linear-gradient(#000,#000) padding-box,linear-gradient(#f22,#f22) border-box;animation:lpulse 1s ease-in-out infinite}
@keyframes lpulse{50%{border-color:transparent}}
.bw.lethal .lf{color:#ff4040}
.badge.shake{animation:shake .5s}
@keyframes shake{10%,50%,90%{transform:translateX(calc(var(--s)*-7px)) rotate(-2deg)}30%,70%{transform:translateX(calc(var(--s)*7px)) rotate(2deg)}}
.badge.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.12)}}
.nm{display:flex;align-items:center;gap:calc(var(--s)*4px);font-size:calc(var(--s)*15px);font-weight:700;white-space:nowrap;max-width:94%;line-height:1.1}
.nm .nmt{overflow:hidden;text-overflow:ellipsis}
.nm .gl{width:calc(var(--s)*14px);height:calc(var(--s)*14px);flex:none}
.lf{font-size:calc(var(--s)*44px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.lf.hit{animation:hit .6s}
.lf.heal{animation:heal .6s}
@keyframes hit{0%{color:#f33;transform:scale(1.35)}}
@keyframes heal{0%{color:#5f5;transform:scale(1.25)}}
.mid{display:flex;align-items:center;justify-content:center;gap:calc(var(--s)*6px);width:100%}
.mid .lf{flex:none}
.cl,.cr{flex:1;display:flex;flex-direction:column;gap:calc(var(--s)*2px);min-width:0}
.cl{align-items:flex-end}
.cr{align-items:flex-start}
.ce{display:inline-flex;align-items:center;font-size:calc(var(--s)*24px);font-weight:900;line-height:1;white-space:nowrap}
.ce svg{width:.8em;height:.8em;margin-right:1px}
.ce.hot{color:#fff!important;background:#c00;border-radius:4px;padding:0 3px}
.crown,.flag,.skull{position:absolute;display:none;pointer-events:none}
.crown{left:50%;top:0;width:calc(var(--s)*40px);height:calc(var(--s)*40px);transform:translate(-50%,-80%);color:#ffd34a}
.crown svg{width:100%;height:100%;animation:cglow 1.8s ease-in-out infinite}
@keyframes cglow{0%,100%{filter:drop-shadow(0 0 2px #ffb300)}50%{filter:drop-shadow(0 0 9px #ffd34a);transform:translateY(-6%)}}
.bw.mon .crown{display:block}
.flag{left:0;top:0;width:calc(var(--s)*30px);height:calc(var(--s)*30px);transform:translate(-40%,-60%);color:#cfe0ff}
.flag svg{width:100%;height:100%;transform-origin:20% 90%;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(-8deg) scaleX(.9)}}
.bw.ini .flag{display:block}
.skull{right:0;top:0;width:calc(var(--s)*28px);height:calc(var(--s)*28px);transform:translate(40%,-60%);color:#ff3b3b}
.skull svg{width:100%;height:100%;animation:throb .8s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.25)}}
.bw.lethal .skull{display:block}
.float{position:absolute;left:50%;top:-10%;font-size:calc(var(--s)*36px*var(--fs,1));font-weight:900;pointer-events:none;animation:rise 1.6s ease-out forwards;white-space:nowrap}
.float.loss{color:#ff4d4d}
.float.gain{color:#5cff7a}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1;transform:translate(-50%,-10%) scale(1.25)}100%{opacity:0;transform:translate(-50%,calc(var(--s)*-80px)) scale(1)}}
.pop{position:absolute;left:50%;top:50%;width:calc(var(--s)*44px*var(--ps,1));height:calc(var(--s)*44px*var(--ps,1));pointer-events:none;animation:pop 1.2s ease-out forwards}
.pop svg{width:100%;height:100%;filter:drop-shadow(0 0 6px currentColor)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.5) rotate(8deg);opacity:1}100%{transform:translate(-50%,-150%) scale(1) rotate(0);opacity:0}}
.flyi{position:absolute;width:70px;height:70px;transform:translate(-50%,-50%);transition:left 1.1s cubic-bezier(.45,0,.25,1),top 1.1s cubic-bezier(.45,0,.25,1)}
.flyi svg{width:100%;height:100%;animation:flys 1.1s ease-in-out;filter:drop-shadow(0 0 8px currentColor)}
@keyframes flys{50%{transform:scale(1.9) rotate(360deg)}}
.ci{text-align:center;transition:transform .8s;white-space:nowrap}
.ci .t{font-size:calc(var(--s)*14px);letter-spacing:.3em;opacity:.7}
.ci .t .ic{width:1.3em;height:1.3em;vertical-align:-.3em}

.ci .w .gl{width:1em;height:1em;margin:0 2px}
.ci .banner{font-size:calc(var(--s)*32px);font-weight:900;letter-spacing:.04em;color:#ffcf8a;animation:bin .7s ease-out}
@keyframes bin{from{opacity:0;filter:blur(8px)}}
#flash{background:#fff;opacity:0}
#flash.go{animation:fl .9s ease-out}
#wipe{width:0;height:0;pointer-events:none}
.orb{position:absolute;left:0;top:0;width:220px;height:220px;margin:-110px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd34a 22%,rgba(255,120,40,.45) 48%,transparent 70%);animation:orb .8s ease-in forwards}
@keyframes orb{0%{transform:scale(.08);opacity:.2}85%{transform:scale(1.3);opacity:1}100%{transform:scale(.2);opacity:0}}
.wave{position:absolute;left:0;top:0;width:3400px;height:3400px;margin:-1700px;border-radius:50%;background:radial-gradient(circle,transparent 60%,rgba(255,255,255,.6) 66%,rgba(255,190,110,.25) 70%,transparent 74%);animation:wave 1.2s ease-out forwards}
@keyframes wave{from{transform:scale(.02)}to{transform:scale(1);opacity:0}}
.cracks{position:absolute;left:-900px;top:-900px;width:1800px;height:1800px;overflow:visible;animation:cfade 2s ease-in forwards}
@keyframes cfade{0%,45%{opacity:1}100%{opacity:0}}
.cracks polyline{fill:none;stroke:#fff;stroke-width:5;stroke-linejoin:round;filter:drop-shadow(0 0 7px #ff9d00);stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:crack .35s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.wtxt{position:absolute;left:0;top:0;font:900 62px system-ui;letter-spacing:.15em;color:#fff;text-shadow:0 0 20px #ff6a00,0 0 44px #ff2a00;white-space:nowrap}
.wtxt>div{animation:wtxt 2.2s ease-out forwards}
@keyframes wtxt{0%{opacity:0;transform:scale(2.6)}14%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#stage.quake #mats,#stage.quake #badges{animation:quake .75s}
@keyframes quake{10%,50%,90%{transform:translate(-10px,6px)}30%,70%{transform:translate(9px,-7px)}}
.mat.wiped{animation:wout 2s ease-out}
.mboom{position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#ffe27a 18%,#ff6a1a 42%,rgba(150,25,0,.65) 68%,rgba(60,0,0,.2) 85%,transparent 100%)}
.mboom.go{animation:mboom 1.3s ease-out}
@keyframes mboom{0%{opacity:1;transform:scale(.15)}18%{opacity:1;transform:scale(1.04)}45%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.bw.wiped .badge{animation:wout 2s ease-out}
@keyframes wout{0%{opacity:1;filter:brightness(4)}12%{opacity:0}60%{opacity:0}100%{opacity:1}}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#grid{box-sizing:border-box;display:none;border:4px solid #0f0;
  background:repeating-linear-gradient(to right,rgba(0,255,0,.4) 0 2px,transparent 2px 120px),repeating-linear-gradient(to bottom,rgba(0,255,0,.4) 0 2px,transparent 2px 120px)}
#calr{position:absolute;box-sizing:border-box;border:4px dashed #ff0}
#calr span{position:absolute;color:#ff0;font:900 40px system-ui;transform:translate(-50%,-50%)}
.h{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#ff0;color:#000;font:900 16px/30px system-ui;text-align:center;border:3px solid #fff;cursor:grab;z-index:10;touch-action:none;box-sizing:content-box}
#edit{display:none;touch-action:none}
.eb{position:absolute;box-sizing:border-box;border:3px dashed #fff;background:rgba(255,255,255,.05);cursor:move}
.eb.b{border-color:#ffd34a}
.eb.c{border-color:#5bf}
.eb span{position:absolute;left:42px;top:6px;font:700 24px system-ui;color:#fff;pointer-events:none}
.ek{position:absolute;z-index:5;width:34px;height:34px;box-sizing:border-box;background:#fff;border:3px solid #000;border-radius:50%;cursor:nwse-resize}
.eb.b .ek{background:#ffd34a}
#waiting{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;font-size:24px}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

        var b2 = read();
        var b3 = read();

        if (c < 128) {
          bytes.push(c);

    for (var i = 8; i < 256; i += 1) {
      EXP_TABLE[i] = EXP_TABLE[i - 4]
        ^ EXP_TABLE[i - 5]
        ^ EXP_TABLE[i - 6]
        ^ EXP_TABLE[i - 8];

    for (var i = 0; i < 255; i += 1) {
      LOG_TABLE[EXP_TABLE[i] ] = i;

      if (n < 1) {
        throw 'glog(' + n + ')';
      }

      return LOG_TABLE[n];
    };

    _this.gexp = function(n) {

      while (n < 0) {
        n += 255;
      }

      while (n >= 256) {
        n -= 255;
      }

      return EXP_TABLE[n];
    };

    return _this;
  }();

  function qrPolynomial(num, shift) {

    if (typeof num.length == 'undefined') {
      throw num.length + '/' + shift;

      var offset = 0;

        offset += 1;
      }
      var _num = new Array(num.length - offset + shift);

      return _num[index];
    };

    _this.getLength = function() {
      return _num.length;

      var num = new Array(_this.getLength() + e.getLength() - 1);

      for (var i = 0; i < _this.getLength(); i += 1) {
        for (var j = 0; j < e.getLength(); j += 1) {
          num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i) ) + QRMath.glog(e.getAt(j) ) );
        }
      }

      return qrPolynomial(num, 0);
    };

    _this.mod = function(e) {

      if (_this.getLength() - e.getLength() < 0) {
        return _this;
      }

      var ratio = QRMath.glog(_this.getAt(0) ) - QRMath.glog(e.getAt(0) );

      var num = new Array(_this.getLength() );
      for (var i = 0; i < _this.getLength(); i += 1) {
        num[i] = _this.getAt(i);
      }

      for (var i = 0; i < e.getLength(); i += 1) {
        num[i] ^= QRMath.gexp(QRMath.glog(e.getAt(i) ) + ratio);
      }

      // recursive call
      return qrPolynomial(num, 0).mod(e);
    };

    return _this;
  };

  function renderControl() {

        Keys: 1–6 select player · ↑/↓ life ±1 (Shift ±5) · P poison +1 · N next turn · Ctrl+Z undo. Turn order runs clockwise from Player 1.<br>
        Calibration: x is inches from your left long side, y is inches from the foot end. Dot 1 (0,0) foot-left, dot 2 (W,0) foot-right, dot 3 (W,L) head-right, dot 4 (0,L) head-left. Double-click the projector window for fullscreen before calibrating.</p>

  app.addEventListener('click', e => {
    const card = e.target.closest('[data-sel]');
    if (card) { sel = +card.dataset.sel; document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.sel === sel)); const sn = document.getElementById('selname'); if (sn) sn.textContent = state.players[sel].name; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const [a, x, y, z] = b.dataset.act.split(':'), i = +x;
    switch (a) {
      case 'open': disp = window.open(location.href.split('#')[0] + '#display', 'mtgDisplay', 'popup,width=1280,height=800'); break;
      case 'edit': commit(s => s.view.edit = !s.view.edit, { undoable: false }); break;
      case 'resetLayout': commit(s => { s.layouts ||= {}; s.layouts[s.count] = emptyLayout(); }); break;
      case 'cal': commit(s => s.view.calibrate = !s.view.calibrate, { undoable: false }); break;
      case 'undo': doUndo(); break;
      case 'start': commit(s => { const id = (s.introId ?? 0) + 1; Object.assign(s, freshState(s)); s.started = true; s.introId = id; }); break;
      case 'black': commit(s => s.started = false); break;
      case 'music': commit(s => s.view.music = s.view.music === false, { undoable: false }); break;
      case 'snd': commit(s => s.view.sound = s.view.sound === false, { undoable: false }); break;
      case 'game': commit(s => { s.game = x; s.board ??= { ...DEF_BOARD }; s.started = false; }, { undoable: false }); break;
      case 'bshow': commit(s => s.started = true, { undoable: false }); break;
      case 'brot': commit(s => s.board.rot = ((s.board.rot + +y) % 360 + 360) % 360, { undoable: false }); break;
      case 'bcenter': commit(s => { s.board.dx = 0; s.board.dy = 0; }, { undoable: false }); break;
      case 'bcol': commit(s => s.board.col = null, { undoable: false }); break;
      case 'prev': nextTurn(-1); break;
      case 'next': nextTurn(1); break;
      case 'dn': commit(s => s.dayNight = x); break;
      case 'banner': commit(s => s.banner = document.getElementById('bannerTxt').value); break;
      case 'bannerClear': commit(s => s.banner = ''); break;
      case 'flash': commit(s => s.flash++, { undoable: false }); break;
      case 'qr': commit(s => { s.phone ||= {}; s.phone.key ||= rid(); s.phone.show = !s.phone.show; }, { undoable: false }); break;
      case 'qrreset': commit(s => { s.phone = { key: rid(), show: true }; s.players.forEach(p => p.dev = null); }, { undoable: false }); break;
      case 'wipe': commit(s => s.wipe = (s.wipe ?? 0) + 1, { undoable: false }); break;
      case 'tfx': commit(s => {
        let val = null;
        if (x === 'd20') val = 1 + Math.floor(Math.random() * 20);
        if (x === 'coin') val = Math.random() < 0.5 ? 'HEADS' : 'TAILS';
        if (x === 'first') { const alive = [...Array(s.count).keys()].filter(i => !s.players[i].dead); val = alive[Math.floor(Math.random() * alive.length)]; s.active = val; s.turn = 1; }
        s.tfx = { id: (s.tfx?.id ?? 0) + 1, k: x, target: Math.min(sel, s.count - 1), val };
      }, { undoable: false }); break;
      case 'dead': commit(s => s.players[i].dead = !s.players[i].dead); break;
      case 'mana': toggleMana(i, y); break;
      case 'life': commit(s => s.players[i].life += +y); break;
      case 'poi': commit(s => s.players[i].poison = Math.max(0, s.players[i].poison + +y)); break;
      case 'cmd': adjCmd(i, +y, +z); break;
      case 'mon': commit(s => s.monarch = s.monarch === i ? -1 : i); break;
      case 'ini': commit(s => s.initiative = s.initiative === i ? -1 : i); break;
      case 'act': commit(s => s.active = i); break;
      case 'resetCal': send({ type: 'resetCal' }); break;
    }
  });

  app.addEventListener('change', e => {
    const t = e.target;
    if (t.type === 'range') { t.blur(); return; }
    if (t.dataset.cmdr) { setCommander(+t.dataset.cmdr, t.value); return; }
    if (t.dataset.seat) {
      const i = +t.dataset.seat, k = +t.value;
      commit(s => {
        const seats = seatsOf(s).slice(), j = seats.indexOf(k);
        if (j >= 0) seats[j] = seats[i];
        seats[i] = k;
        s.seats ||= {}; s.seats[s.count] = seats;
        const L = s.layouts?.[s.count];
        if (L) for (const x of [i, j]) if (x >= 0) { if (L.mats) L.mats[x] = null; if (L.badges) L.badges[x] = null; }
      });
    } else if (t.dataset.pset) {
      const [i, k] = t.dataset.pset.split(':');
      commit(s => s.players[i][k] = t.value);
    } else if (t.dataset.set) {
      const k = t.dataset.set, val = t.type === 'checkbox' ? t.checked : +t.value;
      commit(s => { s[k] = val; if (k === 'count' && s.active >= val) s.active = 0; });
    } else if (t.dataset.bset) {
      const k = t.dataset.bset, val = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value;
      commit(s => { s.board[k] = val; if (k === 'type') s.board.col = null; }, { undoable: false });
    } else if (t.dataset.vset) {
      const k = t.dataset.vset, val = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value;
      commit(s => s.view[k] = val, { undoable: false });
    }
  });
  async function setCommander(i, name) {
    name = name.trim();
    if (!name) { commit(s => { s.players[i].cmdr = null; }); return; }
    try {
      const r = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
      if (!r.ok) throw 0;
      const c = await r.json(), face = c.card_faces?.[0];
      const art = c.image_uris?.art_crop ?? face?.image_uris?.art_crop ?? null;
      const oracle = c.oracle_text ?? (c.card_faces || []).map(f => f.oracle_text).join('\n');
      const ci = [...(c.color_identity || [])].sort((a, b) => 'WUBRG'.indexOf(a) - 'WUBRG'.indexOf(b));
      commit(s => { const p = s.players[i]; p.cmdr = { name: c.name }; p.mana = ci.length ? ci : ['C']; });
    } catch { commit(s => { s.players[i].cmdr = { name }; }); }
  }
  let acT;
  app.addEventListener('input', e => {
    const t = e.target; if (!t.dataset.cmdr) return;
    clearTimeout(acT); const q = t.value.trim(); if (q.length < 2) return;
    acT = setTimeout(async () => {
      try {
        const j = await (await fetch('https://api.scryfall.com/cards/autocomplete?q=' + encodeURIComponent(q))).json();
        document.getElementById('cmdrList').innerHTML = (j.data || []).map(x => `<option value="${esc(x)}">`).join('');
      } catch {}
    }, 250);
  });
  app.addEventListener('input', e => {
    const t = e.target;
    if (t.type === 'range' && t.dataset.bset) commit(s => s.board[t.dataset.bset] = +t.value, { undoable: false, rerender: false });
    if (t.type === 'range' && t.dataset.vset) commit(s => s.view[t.dataset.vset] = +t.value, { undoable: false, rerender: false });
  });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input,select,textarea')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); return; }

    const d = e.shiftKey ? 5 : 1, k = e.key.toLowerCase();
    if (e.key === 'ArrowUp') { e.preventDefault(); commit(s => s.players[sel].life += d); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); commit(s => s.players[sel].life -= d); }
    else if (k === 'p') commit(s => s.players[sel].poison++);
    else if (k === 'n') nextTurn(1);
  });

  renderControl();
  pvf.src = location.href.split('#')[0] + '#preview';
}

/* =================== DISPLAY / PREVIEW =================== */
if (MODE === 'phone') {
  const qs = new URLSearchParams(location.hash.slice(location.hash.indexOf('&') + 1)), seat = +qs.get('seat'), key = qs.get('k');
  let dev = null; try { dev = localStorage.getItem('mtgDev'); } catch {}
  if (!dev) { dev = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); try { localStorage.setItem('mtgDev', dev); } catch {} }
  document.body.innerHTML = '<div id="ph">Connecting…</div>';
  const ph = document.getElementById('ph');
  let S = null, claimT = 0, tries = 0, lastHtml = '';
  // life taps: shown at once (pending), sent one by one, and summed for the current run of presses
  let pend = 0, run = 0, runT = 0, sending = false;
  const post = (type, extra = {}) => fetch('api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, seat, dev, ...extra }) });
  const act = (type, extra = {}) => post(type, extra).then(() => setTimeout(poll, 250)).catch(() => {});
  async function flush() {
    if (sending || !pend) return;
    sending = true;
    const d = pend; pend = 0;
    try { await post('life', { d }); } catch { pend += d; }
    sending = false;
    setTimeout(poll, 200);
    if (pend) flush();
  }
  let want = null, wantT = 0;   // the life total this phone expects, shown until the table catches up (no jumping back)
  const pb = (label, a, cls = '') => `<button class="${cls}" data-a="${a}">${label}</button>`;
  const ARROW = up => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${up ? 'M4 17 12 7l8 10z' : 'M4 7l8 10 8-10z'}" fill="currentColor"/></svg>`;
  const opt = (id, cur, list) => `<select id="${id}">${list.map(([k, l]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  let openCmd = false;
  function render() {
    const s = S, p = s?.players?.[seat];
    let h;
    if (!p || seat >= s.count) h = '<p class="msg">This seat isn\'t part of the current game.</p>';
    else if (!(p.devTag && dev.startsWith(p.devTag))) {
      if (Date.now() - claimT > 2000) { claimT = Date.now(); tries++; act('claim', { key }); }
      h = p.devTag ? `<p class="msg">This seat is already taken by another phone.<br>Ask the game master to reset phones if that's wrong.</p>` : tries > 3 ? '<p class="msg">Couldn\'t join this seat.<br>Scan the QR code on the table again.</p>' : '<p class="msg">Joining seat…</p>';
    } else {
      if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'SELECT') return;
      const c = MANA[p.mana[0]].c, active = s.active === seat, lethal = p.life <= 0 || p.poison >= 10 || p.cmd.some(v => v >= 21);
      const opp = [...Array(s.count).keys()].filter(j => j !== seat);
      if (want !== null && (p.life === want || Date.now() - wantT > 2500)) want = null;
      const life = want ?? p.life;
      const runOn = run && Date.now() - runT < 3000;
      const cmdTot = p.cmd.reduce((x, y) => x + y, 0);
      h = `<div class="bar" style="background:${c}"></div>
      <div class="turn ${active ? 'on' : ''}">${active ? 'YOUR TURN' : esc(s.players[s.active].name) + "'s turn"} · Turn ${s.turn}</div>
      <div class="lifebox">
        <button class="arr plus" data-a="up" aria-label="Gain 1 life">${ARROW(true)}</button>
        <div class="life ${lethal ? 'lethal' : ''}" id="lifeN">${p.dead ? 'OUT' : life}</div>
        <div class="run ${runOn ? (run > 0 ? 'gain' : 'loss') : ''}" id="runN">${runOn ? (run > 0 ? '+' : '−') + Math.abs(run) : '&nbsp;'}</div>
        <button class="arr minus" data-a="down" aria-label="Lose 1 life">${ARROW(false)}</button>

      if (o[key] >= 0) badges[o[key]].classList.remove(cls);
      if (to < 0) { burst(from[0], from[1], type, 30); return; }
      if (bwTo) bwTo.classList.remove(key === 'monarch' ? 'mon' : 'ini');
      fly(k, color, from, bCenter[to], () => {
        if (S[key] !== to) return;
        bwTo.classList.add(key === 'monarch' ? 'mon' : 'ini');
        burst(bCenter[to][0], bCenter[to][1], type, 70); popIcon(bwTo, k, color, 1.8); matFlash(to, color);
      });
    };
    token('monarch', 'crown', '#ffd34a', 'crown');
    token('initiative', 'flag', '#cfe0ff', 'init');
    if (n.active !== o.active && !P[n.active].dead) {
      sweep(mRect[n.active], P[n.active].mana.map(m => MANA[m].c));
      retrigger(badges[n.active].querySelector('.badge'), 'bump');
    }
  }

  function renderCenter() {
    const n = S, a = n.players[n.active];
    ci.style.left = cen[0] + 'px'; ci.style.top = cen[1] + 'px';
    if (n.banner) {
      const edges = [...new Set([...Array(n.count).keys()].filter(i => !n.players[i].dead).map(i => SLOTS[slotOf(i, n)][1]))].sort((x, y) => ROTC[x] - ROTC[y]);
      const key = 'B' + n.banner;
      if (key !== centerKey) { centerKey = key; ci.innerHTML = `<div class="banner">${esc(n.banner)}</div>`; }
      turnTo(ci, ROTC[edges[bIdx % edges.length] ?? 'bottom']);
    } else {
      const key = `T${n.turn}|${n.dayNight}|${a.name}|${a.mana}|${n.view.names}`;
      if (key !== centerKey) {
        centerKey = key; ci.style.setProperty('--ac', accent(a));
        const dn = n.dayNight === 'day' ? ' · ' + ic('sun', '#ffd34a') + ' DAY' : n.dayNight === 'night' ? ' · ' + ic('moon', '#9cc0ff') + ' NIGHT' : '';
        ci.innerHTML = `<div class="t">TURN ${n.turn}${dn}</div><div class="w">${n.view.names ? esc(a.name) : a.mana.map(glyph).join('')}</div>`;
      }
      turnTo(ci, ROTC[SLOTS[slotOf(n.active, n)][1]]);
    }
  }
  setInterval(() => { if (S?.banner) { bIdx++; renderCenter(); } }, 3000);

  function renderEdit() {
    if (!PREVIEW || !S.view.edit || S.game === 'board') { editEl.style.display = 'none'; return; }
    editEl.style.display = 'block';
    let h = '';
    for (let i = 0; i < S.count; i++) {
      const [x0, y0, x1, y1] = matOf(i, S);
      h += `<div class="eb" data-e="mat:${i}" style="left:${x0 * PX}px;top:${y0 * PX}px;width:${(x1 - x0) * PX}px;height:${(y1 - y0) * PX}px"><span>P${i + 1} area</span>
        ${[[0, 0], [100, 0], [100, 100], [0, 100]].map(([x, y], c) => `<div class="ek" data-e="mat:${i}:${c}" style="left:${x}%;top:${y}%;transform:translate(-${x}%,-${y}%)"></div>`).join('')}</div>`;
      const b = badgeOf(i, S), side = b.rot % 180 !== 0, fw = (side ? b.bd : b.bw) * b.s, fh = (side ? b.bw : b.bd) * b.s;
      h += `<div class="eb b" data-e="badge:${i}" style="left:${(b.x - fw / 2) * PX}px;top:${(b.y - fh / 2) * PX}px;width:${fw * PX}px;height:${fh * PX}px">
        <div class="ek" data-e="badge:${i}:2" style="left:100%;top:100%;transform:translate(-100%,-100%)"></div></div>`;
    }
    h += `<div class="eb c" data-e="center:0" style="left:${cen[0] - 100}px;top:${cen[1] - 50}px;width:200px;height:100px"></div>`;
    editEl.innerHTML = h;
  }
  const snap = x => Math.round(x / SNAP) * SNAP;
  editEl.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-e]'); if (!t) return;
    e.preventDefault(); e.stopPropagation();
    const [kind, i, c] = t.dataset.e.split(':');
    S.layouts ||= {};
    S.layouts[S.count] ||= JSON.parse(JSON.stringify(layOf(S) ?? emptyLayout()));
    drag = { kind, i: +i, c: c === undefined ? -1 : +c, sx: e.clientX, sy: e.clientY,
      mat: kind === 'mat' ? matOf(+i, S).slice() : null, badge: kind === 'badge' ? badgeOf(+i, S) : null, center: centerOf(S).slice() };
    editEl.setPointerCapture(e.pointerId);
  });
  editEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = (e.clientX - drag.sx) / (pvK * PX), dy = (e.clientY - drag.sy) / (pvK * PX), v = S.view, L = S.layouts[S.count];
    if (drag.kind === 'mat') {
      let [x0, y0, x1, y1] = drag.mat;
      if (drag.c < 0) { const w = x1 - x0, h = y1 - y0; x0 = Math.min(Math.max(0, snap(x0 + dx)), v.W - w); y0 = Math.min(Math.max(0, snap(y0 + dy)), v.L - h); x1 = x0 + w; y1 = y0 + h; }
      else {
        if (drag.c === 0 || drag.c === 3) x0 = Math.min(Math.max(0, snap(x0 + dx)), x1 - 4); else x1 = Math.max(Math.min(v.W, snap(x1 + dx)), x0 + 4);
        if (drag.c === 0 || drag.c === 1) y0 = Math.min(Math.max(0, snap(y0 + dy)), y1 - 4); else y1 = Math.max(Math.min(v.L, snap(y1 + dy)), y0 + 4);
      }
      L.mats[drag.i] = [x0, y0, x1, y1];
    } else if (drag.kind === 'badge') {
      const b = drag.badge;
      if (drag.c < 0) L.badges[drag.i] = { x: snap(b.x + dx), y: snap(b.y + dy), s: b.s };
      else L.badges[drag.i] = { x: b.x, y: b.y, s: Math.min(2.5, Math.max(0.5, b.s * (1 + (dx + dy) / (b.bw * b.s)))) };
    } else L.center = [snap(drag.center[0] + dx), snap(drag.center[1] + dy)];
    render(S);
  });
  editEl.addEventListener('pointerup', () => {
    if (!drag) return;
    drag = null;
    window.parent.postMessage({ type: 'layout', layout: S.layouts[S.count] }, '*');
  });

  function render(n) {
    const o = S; S = n; const v = n.view;
    $('waiting').style.display = 'none';
    W = v.W * PX; H = v.L * PX;
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    applyWarp();
    const showCal = v.calibrate && !PREVIEW;
    document.body.classList.toggle('cal', showCal);
    handlesEl.style.display = $('grid').style.display = showCal ? 'block' : 'none';
    const cr = $('calr');
    Object.assign(cr.style, { left: v.cx0 * PX + 'px', top: v.cy0 * PX + 'px', width: (v.cx1 - v.cx0) * PX + 'px', height: (v.cy1 - v.cy0) * PX + 'px' });
    [[0, 0], [100, 0], [100, 100], [0, 100]].forEach(([x, y], k) => Object.assign(cr.children[k].style, { left: x + '%', top: y + '%' }));
    $('falloff').style.background = `linear-gradient(${{ left: 'to right', right: 'to left', top: 'to bottom', bottom: 'to top' }[v.bright]},rgba(0,0,0,${v.falloff}),rgba(0,0,0,0) 85%)`;
    const c0 = centerOf(n); cen = [c0[0] * PX, c0[1] * PX];
    ci.style.setProperty('--s', v.hub);

    fxSeats = [];
    mats.forEach((mat, i) => {
      const bw = badges[i];
      if (i >= n.count) { mat.style.display = bw.style.display = mtops[i].style.display = 'none'; return; }
      mat.style.display = bw.style.display = mtops[i].style.display = '';
      const p = n.players[i], rot = ROTC[SLOTS[slotOf(i, n)][1]], side = rot % 180 !== 0, [x0, y0, x1, y1] = matOf(i, n);
      const cols = p.mana.map(m => MANA[m].c), c = cols[0];
      const grad = cols.length > 1 ? cols.concat(c).join(',') : `${c},color-mix(in srgb,${c} 25%,#000),${c},color-mix(in srgb,${c} 25%,#000),${c}`;
      place(mat, (x0 + x1) / 2, (y0 + y1) / 2, side ? y1 - y0 : x1 - x0, side ? x1 - x0 : y1 - y0, rot);
      mat.style.setProperty('--c', c); mat.style.setProperty('--grad', grad);
      mat.classList.toggle('active', i === n.active && !p.dead);
      mat.classList.toggle('dead', p.dead);
      // play area light: the table's setting, or the player's own choice from their phone
      const lm = p.light ?? 'table', lv = lm === 'off' ? 0 : lm === 'table' ? (v.illum ?? 0) : (p.lightLv ?? v.illum ?? 0.3);
      const lhex = lm === 'mana' ? (c.startsWith('#') && c.length === 7 ? c : '#ffffff') : lm === 'white' ? '#ffffff' : (v.lightColor ?? '#ffffff');
      const lc = lhex.match(/\w\w/g).map(h => Math.round(parseInt(h, 16) * lv));
      mat.classList.toggle('b-still', p.border === 'still'); mat.classList.toggle('b-off', p.border === 'off');
      mat.style.setProperty('--fill', `rgb(${lc.join(',')})`);
      ['closed', 'fade', 'open'].forEach(m => mat.classList.toggle('e-' + m, (p.edge ?? 'closed') === m));
      const mt = mtops[i];
      place(mt, (x0 + x1) / 2, (y0 + y1) / 2, side ? y1 - y0 : x1 - x0, side ? x1 - x0 : y1 - y0, rot);
      mt.style.setProperty('--c', c); mt.style.setProperty('--grad', grad);
      mt.classList.toggle('dead', p.dead);
      mt.querySelector('.crest').innerHTML = p.mana.map(glyph).join('');
      tPt[i] = [rot === 0 ? (x0 + x1) / 2 : rot === 180 ? (x0 + x1) / 2 : rot === 90 ? x1 : x0, rot === 0 ? y0 : rot === 180 ? y1 : (y0 + y1) / 2].map(z => z * PX);
      mat.querySelectorAll('.cz').forEach(z => z.style.display = v.zones ? '' : 'none');
      mRect[i] = [x0 * PX, y0 * PX, x1 * PX, y1 * PX];

      const b = badgeOf(i, n);
      place(bw, b.x, b.y, b.bw * b.s, b.bd * b.s, b.rot);
      bw.style.setProperty('--s', v.hub * b.s); bw.style.setProperty('--c', c);
      bw.style.setProperty('--grad2', cols.length > 1 ? cols.join(',') : `${c},${c}`);
      bw.classList.toggle('dead', p.dead);
      bw.classList.toggle('lethal', !p.dead && (p.life <= 0 || p.poison >= 10 || p.cmd.some(x => x >= 21)));
      if (!o || o.monarch === n.monarch) bw.classList.toggle('mon', n.monarch === i);
      if (!o || o.initiative === n.initiative) bw.classList.toggle('ini', n.initiative === i);
      bw.querySelector('.gls').innerHTML = p.mana.map(glyph).join('');
      bw.querySelector('.nmt').textContent = p.name;
      bw.querySelector('.lf').textContent = p.dead ? 'OUT' : p.life;
      bw.classList.toggle('nob', !(v.bborder ?? true));
      bw.classList.toggle('non', !v.names);
      const ent = [];
      if (p.poison) ent.push(`<span class="ce${p.poison >= 10 ? ' hot' : ''}" style="color:#7dff6a">${svgI('skull')}${p.poison}</span>`);
      p.cmd.forEach((x, j) => { if (x && j < n.count) ent.push(`<span class="ce${x >= 21 ? ' hot' : ''}" style="color:${accent(n.players[j])}">${svgI('sword')}${x}</span>`); });
      bw.querySelector('.cl').innerHTML = ent.filter((_, k) => k % 2 === 0).join('');
      bw.querySelector('.cr').innerHTML = ent.filter((_, k) => k % 2 === 1).join('');
      bCenter[i] = [b.x * PX, b.y * PX];
      if (!p.dead) fxSeats[i] = { r: mRect[i], mana: p.mana, active: i === n.active, skip: (p.edge ?? 'closed') === 'closed' ? null : SLOTS[slotOf(i, n)][1] };
    });

    stage.classList.toggle('idle', !n.started);
    const bm = n.game === 'board', bd = $('board');
    stage.classList.toggle('boardmode', bm);
    bd.style.display = bm ? '' : 'none';
    if (bm) {
      const B = n.board, D = BOARDS[B.type], ah = D.ah ?? 1, o2 = { col: B.col ?? D.col, labels: B.labels }, key = B.type + JSON.stringify(o2);
      if (bd._k !== key) { bd._k = key; bd.setAttribute('viewBox', `0 0 1000 ${1000 * ah}`); bd.innerHTML = D.svg(o2); }
      place(bd, v.W / 2 + B.dx, v.L / 2 + B.dy, B.size, B.size * ah, B.rot);
      bd.style.filter = `brightness(${B.bright})`;
    }
    if (bm) {}
    else if (n.started && o && (o.introId ?? 0) !== (n.introId ?? 0)) playIntro(n);
    else if (o && o !== n && n.started && o.game !== 'board') effects(o, n);
    const alive = [...Array(n.count).keys()].filter(i => !n.players[i].dead);
    const w = !bm && n.started && n.count > 1 && alive.length === 1 ? alive[0] : -1;
    if (w !== vicFor) { vicFor = w; showVictory(w, n); }
    if (!n.banner) bIdx = 0;
    renderCenter();
    renderEdit();
    if (o && o.flash !== n.flash) retrigger($('flash'), 'go');
    if (o && !bm && n.started && (o.wipe ?? 0) !== (n.wipe ?? 0)) playWipe(n);
    if (o && !bm && n.started && n.tfx && n.tfx.id !== o.tfx?.id) playTfx(n);
    renderQRs(n);
  }

  let lan = null; const qrCache = {};
  fetch('api/info').then(r => r.ok ? r.json() : null).then(j => { lan = j; if (S) render(S); }).catch(() => {});
  function qrSvg(text) {
    if (qrCache[text]) return qrCache[text];
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const m = q.getModuleCount(); let d = '';
    for (let r = 0; r < m; r++) for (let c = 0; c < m; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
    return qrCache[text] = `<svg viewBox="-2 -2 ${m + 4} ${m + 4}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  }
  function renderQRs(n) {
    const box = $('qrs');
    if (!lan || !n.phone?.show || !n.phone.key || n.game === 'board') { box.innerHTML = ''; return; }
    let h = '';
    for (let i = 0; i < n.count; i++) {
      if (n.players[i].dev) continue;
      const r = mRect[i], sz = Math.min(190, (r[2] - r[0]) * 0.8, (r[3] - r[1]) * 0.8);
      const url = `http://${lan.ip}:${lan.port}${location.pathname}#phone&seat=${i}&k=${n.phone.key}`;
      h += `<div class="qr" style="width:${sz}px;transform:translate(${(r[0] + r[2]) / 2}px,${(r[1] + r[3]) / 2}px) translate(-50%,-50%) rotate(${ROTC[SLOTS[slotOf(i, n)][1]]}deg)">${qrSvg(url)}Scan to join · Seat ${i + 1}</div>`;
    }
    box.innerHTML = h;
  }
  const onMsg = d => {
    if (d?.type === 'state') { if (!drag) render(d.state); }
    else if (d?.type === 'resetCal' && !PREVIEW) { cal = null; try { localStorage.removeItem(CKEY); } catch {} applyWarp(); }
  };
  addEventListener('message', e => onMsg(e.data));
  if (bc) bc.onmessage = e => onMsg(e.data);
  addEventListener('resize', applyWarp);

  if (PREVIEW) {
    $('waiting').textContent = '';
    window.parent.postMessage({ type: 'phello' }, '*');
  } else {
    const hello = first => {
      if (window.opener && !window.opener.closed) window.opener.postMessage({ type: 'hello', first }, '*');
      bc?.postMessage({ type: 'hello', first });
    };
    hello(true); setInterval(() => hello(false), 1500);
    addEventListener('dblclick', e => {
      if (e.target.classList.contains('h')) return;
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    });
    addEventListener('keydown', e => {
      if (!S?.view.calibrate) return;
      const d = e.shiftKey ? 10 : 1, mv2 = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
      if (!mv2) return;
      e.preventDefault(); ensureCal();
      cal[lastHandle] = [cal[lastHandle][0] + mv2[0], cal[lastHandle][1] + mv2[1]];
      applyWarp(); saveCal();
    });
  }
  applyWarp();
  requestAnimationFrame(frame);
}
</script>
</body>
